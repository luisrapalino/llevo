<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <title>Sin conexión · Llevo</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fffaf1; color: #14213d;
        font-family: 'Nunito Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { height: 56px; }
      h1 { font-size: 26px; margin: 28px 0 8px; letter-spacing: -0.02em; }
      p { color: #4a5470; line-height: 1.5; margin: 0; }
      button { margin-top: 28px; height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: #2f5bea; color: #fff;
        font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/llevo-logo.svg" alt="Llevo" />
      <h1>Estás sin conexión</h1>
      <p>Revisa tu internet y vuelve a intentarlo. Tu información no se perdió.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
