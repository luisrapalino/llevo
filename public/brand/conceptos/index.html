<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Conceptos de logo · Llevo</title>
    <style>
      body { margin: 0; background: #fffaf1; color: #14213d; font: 16px/1.4 system-ui, sans-serif; }
      main { max-width: 980px; margin: 0 auto; padding: 32px 24px 64px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p.lead { margin: 0 0 28px; color: #4a5470; }
      article { margin: 0 0 36px; }
      h2 { font-size: 15px; margin: 0 0 10px; }
      .stage { background: #fffaf1; border-radius: 16px; padding: 28px 32px; }
      .stage img { width: min(100%, 520px); height: auto; display: block; }
      .row { display: flex; gap: 28px; align-items: end; margin-top: 16px; }
      .tiny { background: #fffaf1; }
      .tiny img { width: 120px; }
      .micro img { width: 32px; height: auto; }
      .dark { background: #14213d; border-radius: 12px; padding: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tres direcciones</h1>
      <p class="lead">Misma palabra, misma paleta. El tamaño chico está a la derecha.</p>
      <article>
        <h2>A — El pin es la o</h2>
        <div class="stage"><img src="a-pin.svg?v=3" alt="Concepto A" /></div>
        <div class="row tiny"><img src="a-pin.svg?v=3" alt="" /><span class="micro"><img src="a-pin.svg?v=3" alt="" /></span></div>
      </article>
      <article>
        <h2>B — Placa y cinta</h2>
        <div class="stage"><img src="b-placa.svg?v=3" alt="Concepto B" /></div>
        <div class="row tiny"><img src="b-placa.svg?v=3" alt="" /><span class="micro"><img src="b-placa.svg?v=3" alt="" /></span></div>
      </article>
      <article>
        <h2>C — Sello y palabra</h2>
        <div class="stage"><img src="c-sello.svg?v=3" alt="Concepto C" /></div>
        <div class="row tiny"><img src="c-sello.svg?v=3" alt="" /><span class="micro"><img src="c-sello.svg?v=3" alt="" /></span></div>
      </article>
    </main>
  </body>
</html>
